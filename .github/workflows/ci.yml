name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Conan
        uses: conan-io/setup-conan@e5a0f7458fd48abde38af3d5b8ea23b7f4bc4a4c # v1.1.2
        with:
          version: 2.31.2
          profile_detect: true

      - name: Install dependencies
        run: conan install . --build=missing -s build_type=Debug -c tools.cmake.cmaketoolchain:generator=Ninja --lockfile=conan.lock

      - name: Configure
        run: cmake -S . -B build/Debug -G Ninja -DCMAKE_TOOLCHAIN_FILE=build/Debug/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/Debug --config Debug

      - name: Test
        run: ctest --test-dir build/Debug -C Debug --output-on-failure
